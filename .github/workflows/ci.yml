name: Deploy to Cloudflare

# Builds the site with OpenNext and ships it to the dev-portfolio Cloudflare Worker,
# the Workers version of the bizadvisor site's Pages workflow:
#   - pull_request  -> lint, type-check, build, then upload a preview version
#                      (alias "pr-<number>", its own URL; production is untouched).
#                      The preview URL is posted / updated as a PR comment.
#   - push to main  -> same checks, then deploy to production (udaradev.me).
# Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cloudflare-${{ github.ref }}
  # A newer push to a PR replaces its older run; a production deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  cloudflare:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      # Pull requests from forks get no secrets, so they stop after the build.
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -o pipefail
          alias="pr-${{ github.event.pull_request.number }}"
          npx opennextjs-cloudflare upload \
            --preview-alias "$alias" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" 2>&1 | tee upload.log
          url=$(grep -oE "https://${alias}-[a-z0-9.-]+\.workers\.dev" upload.log | tail -1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.preview.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.preview.outputs.url) }};
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- cf-workers-preview -->';
            const body = `${marker}\n### Portfolio preview\n${url || 'Uploaded, but no preview URL was printed. Check the workflow log.'}\n\nCommit \`${sha}\` · production is not changed until this is merged into \`main\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx opennextjs-cloudflare deploy
